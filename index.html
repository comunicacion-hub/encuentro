<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería · Encuentro Nacional de Organizaciones Lideradas por Mujeres</title>
<meta name="description" content="Galería de fotos del Encuentro Nacional de Organizaciones Lideradas por Mujeres. Fundación Redes Con Rostro y ACNUR.">
<link rel="icon" href="assets/logos/encuentro.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --morado:#7A1F7C; --morado-osc:#5A145C; --tinta:#2B1B2E; --texto:#5C4A5C;
    --suave:#F6EEF5; --borde:#D9C2D9; --fondo:#FBF6F1;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--tinta);background:#fff;-webkit-font-smoothing:antialiased}
  body.bloqueado{overflow:hidden}
  button,a{font:inherit}
  [hidden]{display:none!important}

  /* Pantallas de intro */
  .pantalla{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:#fff}
  .intro img{height:min(52vh,460px);max-width:78vw;object-fit:contain;animation:fadeIn 1.1s ease-out both}
  .logos .fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:36px}
  .logos img{width:min(240px,48vw);height:auto;animation:subir .9s ease-out both}
  .logos img:last-child{animation-delay:.35s}
  .logos .sep{width:2px;height:72px;background:#E8DCE8}
  .saltar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px 28px;z-index:5}
  .barra{width:160px;height:3px;background:#F0E6F0;border-radius:3px;overflow:hidden}
  .barra span{display:block;height:3px;background:var(--morado);animation:barra 3.6s linear both}

  .btn-sec{font-weight:600;font-size:14px;color:var(--morado);background:#fff;border:1.5px solid var(--borde);border-radius:999px;padding:12px 22px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .btn-sec:hover{background:#F3E6F2}
  .btn-pri{font-weight:600;font-size:14px;color:#fff;background:var(--morado);border:none;border-radius:999px;padding:12px 20px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .btn-pri:hover{background:var(--morado-osc)}
  :focus-visible{outline:3px solid #C77BC9;outline-offset:2px}

  /* Galería */
  .galeria{min-height:100vh;background:var(--fondo);animation:fadeIn .6s ease-out both}
  .cabecera{max-width:1200px;margin:0 auto;padding:48px 24px 24px;display:flex;flex-direction:column;gap:10px}
  .kicker{margin:0;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#8A5A86}
  h1{margin:0;font:700 clamp(28px,4.2vw,48px)/1.08 'Josefin Sans',sans-serif;color:var(--morado);max-width:760px}
  .bajada{margin:0;font-size:16px;line-height:1.5;color:var(--texto);max-width:720px}
  .grid{list-style:none;max-width:1200px;margin:0 auto;padding:24px 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:40px 32px}
  .polaroid{margin:0;background:#fff;padding:14px 14px 0;border-radius:3px;box-shadow:0 8px 22px rgba(60,20,60,.14);transform:rotate(var(--rot));animation:caer .7s cubic-bezier(.2,.8,.3,1.1) both;animation-delay:var(--delay);transition:transform .25s ease,box-shadow .25s ease;position:relative}
  .polaroid:hover,.polaroid:focus-within{transform:rotate(0) translateY(-6px) scale(1.03);box-shadow:0 18px 40px rgba(60,20,60,.22);z-index:2}
  .ver{display:block;width:100%;padding:0;border:none;background:none;cursor:zoom-in}
  .ver img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:#EFE7EC}
  .pie{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px 12px}
  .tag{font:600 23px/1.1 Caveat,cursive;color:#3D2A40;overflow-wrap:anywhere}
  .bajar{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;background:var(--suave);color:var(--morado);text-decoration:none}
  .bajar:hover{background:#EBDCEA}

  /* Visor */
  .visor{position:fixed;inset:0;background:rgba(28,14,30,.88);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;animation:fadeIn .2s ease-out both}
  .visor-caja{background:#fff;padding:16px 16px 0;border-radius:4px;width:min(960px,100%);box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .visor-caja img{display:block;width:100%;max-height:72vh;object-fit:contain;background:#F4EEF2}
  .visor-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px 16px}
  .visor-pie .tag{font-size:30px}
  .visor-acciones{display:flex;flex-wrap:wrap;gap:10px}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;border:none;background:rgba(255,255,255,.92);color:var(--morado);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .nav.prev{left:12px}.nav.next{right:12px}
  .nav:hover{background:#fff}

  @keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  @keyframes subir{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes caer{from{opacity:0;transform:translateY(-40px) rotate(0)}}
  @keyframes barra{from{width:0}to{width:100%}}
  @media (max-width:560px){.logos .sep{display:none}.logos .fila{flex-direction:column;gap:32px}.cabecera{padding:36px 16px 16px}.grid{padding:16px 16px 64px;gap:32px}.nav{top:auto;bottom:16px;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="pantalla intro" id="intro" aria-label="Presentación">
  <img src="assets/logos/encuentro.jpg" alt="Encuentro Nacional de Organizaciones Lideradas por Mujeres">
</section>

<section class="pantalla logos" id="logos" aria-label="Organizan" hidden>
  <div class="fila">
    <img src="assets/logos/rcr.png" alt="Fundación Redes Con Rostro">
    <div class="sep" aria-hidden="true"></div>
    <img src="assets/logos/acnur.png" alt="ACNUR, la Agencia de la ONU para los Refugiados">
  </div>
</section>

<div class="saltar" id="saltar">
  <button class="btn-sec" id="btnSaltar" type="button">Ir a la galería</button>
  <div class="barra" aria-hidden="true"><span id="barra"></span></div>
</div>

<main class="galeria" id="galeria" hidden>
  <header class="cabecera">
    <p class="kicker">Galería de fotos</p>
    <h1>Encuentro Nacional de Organizaciones Lideradas por Mujeres</h1>
    <p class="bajada">Toca una foto para verla en grande. Todas se pueden descargar en su resolución original.</p>
  </header>
  <ul class="grid" id="grid"></ul>
</main>

<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
  <button class="nav prev" id="prev" type="button" aria-label="Foto anterior">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="visor-caja">
    <img id="visorImg" src="" alt="">
    <div class="visor-pie">
      <span class="tag" id="visorTag"></span>
      <div class="visor-acciones">
        <button class="btn-sec" id="cerrar" type="button">Cerrar</button>
        <a class="btn-pri" id="visorBajar" href="#" download>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          Descargar original
        </a>
      </div>
    </div>
  </div>
  <button class="nav next" id="next" type="button" aria-label="Foto siguiente">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<script>
(function () {
  // Una etiqueta por foto, en el mismo orden que los archivos encuentro-01.jpg ... encuentro-51.jpg
  var TAGS = ['Escucha','Alegría','Celebración','Tejido','Creatividad','Expresión','Complicidad','Encuentro','Voz','Liderazgo','Compromiso','Acompañamiento','Comunidad','Alianza','Identidad','Hermandad','Reconocimiento','Abrazo','Sororidad','Raíces','Lideresas','Unidad','Amistad','Reencuentro','Diálogo','Juntas','Orgullo','Ternura','Equipo','Colectiva','Incidencia',
    'Redes','Cariño','Fortaleza','Fuerza','Sonrisas','Gratitud','Diversidad','Cuidado','Cercanía','Confianza','Calidez','Libertad','Felicidad','Herencia','Resiliencia','Participación','Círculo','Aprendizaje','Solidaridad','Esperanza'];
  var ROTS = [-3, 2, -1.5, 3, -2, 1, 2.5, -3, 1.5, -1, 3, -2.5];
  var ICONO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';

  var fotos = TAGS.map(function (tag, i) {
    var n = String(i + 1).padStart(2, '0');
    var archivo = 'encuentro-' + n + '.jpg';
    return {
      tag: '#' + tag,
      thumb: 'assets/fotos/thumb/' + archivo,
      large: 'assets/fotos/large/' + archivo,
      original: 'assets/fotos/original/' + archivo,
      nombre: 'encuentro-mujeres-' + n + '-' + tag.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase() + '.jpg',
      alt: 'Encuentro Nacional de Organizaciones Lideradas por Mujeres: ' + tag
    };
  });

  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid');
  grid.innerHTML = fotos.map(function (f, i) {
    return '<li class="polaroid" style="--rot:' + ROTS[i % ROTS.length] + 'deg;--delay:' + (i * 60) + 'ms">' +
      '<button class="ver" type="button" data-i="' + i + '" aria-label="Ver ' + f.tag + ' en grande">' +
      '<img src="' + f.thumb + '" alt="' + f.alt + '" loading="lazy" width="900" height="600"></button>' +
      '<div class="pie"><span class="tag">' + f.tag + '</span>' +
      '<a class="bajar" href="' + f.original + '" download="' + f.nombre + '" aria-label="Descargar ' + f.tag + '">' + ICONO + '</a></div></li>';
  }).join('');

  // Secuencia: ilustración -> logos -> galería
  var timers = [];
  function mostrar(etapa) {
    $('intro').hidden = etapa !== 'intro';
    $('logos').hidden = etapa !== 'logos';
    $('galeria').hidden = etapa !== 'galeria';
    $('saltar').hidden = etapa === 'galeria';
    var b = $('barra'); b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    window.scrollTo(0, 0);
  }
  function irAGaleria() { timers.forEach(clearTimeout); mostrar('galeria'); }
  mostrar('intro');
  timers.push(setTimeout(function () { mostrar('logos'); }, 3800));
  timers.push(setTimeout(irAGaleria, 7400));
  $('btnSaltar').addEventListener('click', irAGaleria);

  // Visor
  var actual = 0, origen = null;
  function abrir(i) {
    actual = (i + fotos.length) % fotos.length;
    var f = fotos[actual];
    $('visorImg').src = f.large; $('visorImg').alt = f.alt;
    $('visorTag').textContent = f.tag;
    $('visorBajar').href = f.original; $('visorBajar').setAttribute('download', f.nombre);
    if ($('visor').hidden) { origen = document.activeElement; $('visor').hidden = false; document.body.classList.add('bloqueado'); $('cerrar').focus(); }
  }
  function cerrar() { $('visor').hidden = true; document.body.classList.remove('bloqueado'); if (origen) origen.focus(); }
  grid.addEventListener('click', function (e) { var b = e.target.closest('.ver'); if (b) abrir(+b.dataset.i); });
  $('cerrar').addEventListener('click', cerrar);
  $('prev').addEventListener('click', function () { abrir(actual - 1); });
  $('next').addEventListener('click', function () { abrir(actual + 1); });
  $('visor').addEventListener('click', function (e) { if (e.target === this) cerrar(); });
  document.addEventListener('keydown', function (e) {
    if ($('visor').hidden) return;
    if (e.key === 'Escape') cerrar();
    if (e.key === 'ArrowLeft') abrir(actual - 1);
    if (e.key === 'ArrowRight') abrir(actual + 1);
  });
})();
</script>
</body>
</html>
